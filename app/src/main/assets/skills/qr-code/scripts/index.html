<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
</head>
<body>
  <script>
    window['ai_edge_gallery_get_result'] = async function(data) {
      try {
        const params = JSON.parse(data || "{}");
        const url = params.url || params.text || "";
        return JSON.stringify({
          result: JSON.stringify({ status: "success", url: url }),
          error: null
        });
      } catch (err) {
        return JSON.stringify({ result: null, error: err.message });
      }
    };
  </script>
</body>
</html>
